# ============================================================
# Legal RAG — Docker Compose (Database Services Only)
# ============================================================
#
# Services:
#   neo4j   — Graph DB (Local, port 7474/7687)
#   qdrant  — Vector DB Local Fallback (Local, port 6333/6334)
#   api     — FastAPI Backend (Optional, port 8000)
#
# Khởi động riêng Database (Cực kỳ nhẹ RAM):
#   docker compose up neo4j qdrant -d
# ============================================================

services:

  # ── Neo4j Graph Database ──────────────────────────────────
  neo4j:
    image: neo4j:5.15-community
    container_name: legal_rag_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser UI
      - "7687:7687"   # Bolt protocol (driver kết nối)
    environment:
      - NEO4J_AUTH=neo4j/legalrag123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1.5G
      - NEO4J_dbms_memory_pagecache_size=512m

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Qdrant Vector Database (Fallback / Local) ──────────────
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: legal_rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API & Web Dashboard UI (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage

  # ── FastAPI Backend (Optional Docker deployment) ───────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: legal_rag_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./backend/data/rag:/app/data/rag:ro
      - ./backend/logs:/app/logs
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  qdrant_storage:

