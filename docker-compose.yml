# ============================================================
# Legal RAG — Docker Compose
# ============================================================
#
# Services:
#   neo4j   — Graph DB (Local, port 7474/7687)
#   api     — FastAPI Backend (port 8000)
#   offline — Pipeline scripts (chạy thủ công, không autostart)
#
# Khởi động:
#   docker compose up neo4j api        # Chạy server
#   docker compose run --rm offline \  # Chạy offline pipeline
#     python scripts/offline_rag/01_fix_preprocess.py
# ============================================================

services:

  # ── Neo4j Graph Database ──────────────────────────────────
  neo4j:
    image: neo4j:5.15-community
    container_name: legal_rag_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser UI
      - "7687:7687"   # Bolt protocol (driver kết nối)
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── FastAPI Backend ───────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: legal_rag_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override NEO4J_URI để dùng service name thay vì localhost
      - NEO4J_URI=bolt://neo4j:7687
    volumes:
      # Mount data để dùng chung với offline pipeline
      - ./backend/data/rag:/app/data/rag:ro   # read-only (chỉ read, không write)
      - ./backend/logs:/app/logs
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Offline Pipeline ──────────────────────────────────────
  # Không autostart — chạy thủ công bằng:
  #   docker compose run --rm offline python scripts/offline_rag/01_fix_preprocess.py
  offline:
    build:
      context: ./backend
      dockerfile: Dockerfile.offline
    container_name: legal_rag_offline
    env_file:
      - ./backend/.env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
    volumes:
      # Mount data read-write để scripts ghi output
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    depends_on:
      - neo4j
    profiles:
      - offline   # Chỉ start khi dùng --profile offline

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
